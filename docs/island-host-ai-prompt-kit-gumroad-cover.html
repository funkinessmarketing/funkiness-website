<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gumroad cover</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@800;900&family=Inter:wght@400;500;600&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 1280px;
    height: 720px;
    overflow: hidden;
    background: #f7efe7;
    font-family: 'Inter', sans-serif;
  }
  .frame {
    position: relative;
    width: 1280px;
    height: 720px;
    background: #f7efe7;
    overflow: hidden;
  }
  .blob {
    position: absolute;
    background: #f21b7a;
    border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%;
  }
  .blob-1 { width: 620px; height: 620px; right: -160px; bottom: -240px; opacity: 0.16; }
  .blob-2 { width: 320px; height: 320px; right: 140px; bottom: -60px; opacity: 0.24; }
  .ghost-num {
    position: absolute;
    right: 60px;
    top: 50%;
    transform: translateY(-50%);
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-size: 420px;
    color: rgba(8,4,3,0.05);
    line-height: 1;
  }
  .content {
    position: relative;
    height: 100%;
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 0 0 72px;
    max-width: 900px;
  }
  .eyebrow {
    font-family: 'Permanent Marker', cursive;
    color: #f21b7a;
    font-size: 22px;
    margin-bottom: 22px;
  }
  .title {
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-size: 64px;
    line-height: 1.08;
    color: #080403;
    margin-bottom: 26px;
  }
  .title em {
    font-family: 'Permanent Marker', cursive;
    color: #f21b7a;
    font-style: normal;
  }
  .sub {
    font-size: 21px;
    color: rgba(8,4,3,0.6);
    line-height: 1.55;
    max-width: 560px;
    margin-bottom: 34px;
  }
  .tags {
    display: flex;
    gap: 12px;
  }
  .tag {
    background: #080403;
    color: #f21b7a;
    font-family: 'Permanent Marker', cursive;
    font-size: 17px;
    padding: 7px 20px;
    border-radius: 999px;
  }
  .brand {
    position: absolute;
    left: 72px;
    bottom: 40px;
    display: flex;
    align-items: baseline;
    gap: 14px;
  }
  .brand-name {
    font-family: 'Poppins', sans-serif;
    font-weight: 900;
    font-size: 20px;
    color: #080403;
  }
  .brand-name em {
    font-family: 'Permanent Marker', cursive;
    color: #f21b7a;
    font-style: normal;
  }
  .brand-url {
    font-size: 15px;
    color: rgba(8,4,3,0.4);
  }
</style>
</head>
<body>
<div class="frame">
  <div class="blob blob-1"></div>
  <div class="blob blob-2"></div>
  <div class="ghost-num">11</div>
  <div class="content">
    <div class="eyebrow">11 copy-paste prompts for vacation rental owners</div>
    <h1 class="title">The Island Host<br>AI <em>Prompt Kit</em></h1>
    <p class="sub">Copy-paste AI prompts for Airbnb, VRBO and Micazu listings on Aruba, Bonaire and Curaçao.</p>
    <div class="tags">
      <span class="tag">Airbnb</span>
      <span class="tag">VRBO</span>
      <span class="tag">Micazu</span>
    </div>
  </div>
  <div class="brand">
    <span class="brand-name">FUN<em>kiness!</em></span>
    <span class="brand-url">funkiness.ai</span>
  </div>
</div>
</body>
</html>
