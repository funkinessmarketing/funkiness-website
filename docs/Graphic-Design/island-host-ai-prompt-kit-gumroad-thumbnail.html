<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Gumroad thumbnail</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@900&family=Permanent+Marker&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 600px; height: 600px; overflow: hidden; background: #f7efe7; }
  .frame { position: relative; width: 600px; height: 600px; background: #f7efe7; overflow: hidden; }
  .blob { position: absolute; border-radius: 62% 38% 46% 54% / 60% 44% 56% 40%; }
  .blob-pink { width: 420px; height: 400px; right: -120px; top: -100px; background: #f21b7a; }
  .blob-brown { width: 300px; height: 300px; left: -110px; bottom: -110px; background: #3a251b; border-radius: 48% 52% 40% 60% / 55% 45% 55% 45%; }
  .content { position: absolute; left: 56px; top: 236px; }
  .title { font-family: 'Poppins', sans-serif; font-weight: 900; font-size: 50px; line-height: 1; color: #3a251b; letter-spacing: -0.5px; }
  .script { font-family: 'Permanent Marker', cursive; font-size: 50px; color: #f21b7a; margin-top: 18px; line-height: 1; }
</style>
</head>
<body>
<div class="frame">
  <div class="blob blob-pink"></div>
  <div class="blob blob-brown"></div>
  <div class="content">
    <div class="title">ISLAND HOST</div>
    <div class="script">AI Prompt Kit</div>
  </div>
</div>
</body>
</html>
